# Maestro E2E — the golden read-aloud flow.
#
# One stable, high-value path exercised on a real simulator/emulator: the app
# loads, the WebView renders the document, and the controls drive the shared
# Rust core with the resulting Snapshot coming back up into the UI.
#
# Kept deliberately small (see docs/testing-strategy.md) — E2E is here to catch a
# dead bridge or broken wiring, not to re-test core logic that cargo already
# covers far more cheaply.
#
# ## Why this asserts what it asserts
# Every selector below was taken from a real `maestro hierarchy` dump, not from
# what the app "should" expose. Two consequences worth knowing before editing:
#
#   * There are no testIDs in the app, so `id:` selectors match nothing. The
#     controls are found by their accessibility labels — which is a feature, not
#     a workaround: if a label regresses, a screen-reader user loses the control
#     and this flow goes red for the same reason.
#   * The WebView's DOM is not addressable (the `<mark id="aloud-current">`
#     highlight is invisible to the hierarchy). The canvas is asserted via its
#     document title and the article text instead, which still proves the
#     document made it from JS into the WebView.
#
# The flow deliberately does NOT assert that the highlight advances during
# playback. That depends on real TTS audio timing, which is not deterministic in
# a simulator, and a flaky golden path is worse than a narrow one. Word-boundary
# behaviour is covered exhaustively off-device by the Rust suite and by the
# JSDOM tests in app/__tests__/reader.test.ts.
#
# Run:  maestro test e2e/read-aloud.yaml
appId: org.reactjs.native.example.AloudApp
---
- launchApp:
    clearState: true

# The app mounted and the WebView rendered the document handed to it by JS.
# "Aloud reader canvas" is reader.html's <title>; the article text is the
# document that crossed RN -> WebView via postMessage.
# `extendedWaitUntil` rather than `assertVisible`: the WebView only renders
# after the ready -> render postMessage round-trip, so this content is genuinely
# asynchronous. A bare assert passes on a warm laptop and fails on a cold CI
# runner — flakiness, not a signal. The assertion is no weaker: it still fails
# if the content never arrives.
- extendedWaitUntil:
    visible: "Aloud reader canvas"
    timeout: 60000
- extendedWaitUntil:
    visible:
      text: "Aloud reads to you.*"
    timeout: 60000

# The primary control is present and labelled for a screen reader.
- assertVisible: "Play"

# Position starts at the top of the document. This comes from the Rust core's
# Snapshot (unit 0 of 5), rendered by the ViewModel — so it already proves the
# load path: JS -> native -> core -> Snapshot -> back up.
- extendedWaitUntil:
    visible: "Sentence 1 of 5"
    timeout: 60000

# Step forward while PAUSED. This is the deterministic half of the bridge test:
# the tap dispatches Next into the core and the new Snapshot must come back and
# re-render, with no audio timing involved.
- tapOn: "Next sentence"
- assertVisible: "Sentence 2 of 5"

# ...and back, proving the core's position is genuinely bidirectional rather
# than a counter incrementing in JS.
- tapOn: "Previous sentence"
- assertVisible: "Sentence 1 of 5"

# Start playback. The control's label flipping to "Pause" is driven by
# Snapshot.status coming back from the native layer, so this asserts the
# playback path is wired end to end.
- tapOn: "Play"
- assertVisible: "Pause"

# Stop again and confirm the state returns.
- tapOn: "Pause"
- assertVisible: "Play"
