name: Device toolchain

# The slow half of CI: everything that needs a real mobile toolchain — the Rust
# core cross-compiled for each platform, and the native modules actually built
# against it.
#
# Kept out of ci.yml on purpose. Those jobs are hermetic and finish in under a
# minute, so they gate every push; these take many minutes and only ever break
# when the native surface moves. Splitting them keeps the fast feedback fast
# without leaving the cross-compilation unverified.
#
# What this catches that ci.yml cannot: a change to the C ABI, the header, the
# podspec, the Gradle plumbing or the build scripts that compiles fine in
# isolation but breaks when Swift/Kotlin are actually built against the real
# artifact. (The uint32_t/size_t fix in #32 was exactly that shape — the
# xcframework had to be regenerated by hand for the Swift side to see it.)

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "core/**"
      - "native/**"
      - "scripts/**"
      - "contracts/**"
      - "example/ios/**"
      - "example/android/**"
      - ".github/workflows/device-toolchain.yml"
  workflow_dispatch:

jobs:
  ios:
    name: iOS (xcframework · pod install · build)
    runs-on: macos-latest
    env:
      # CocoaPods crashes inside its own error reporter on an ASCII-8BIT locale
      # ("Unicode Normalization not appropriate for ASCII-8BIT"), which masks
      # whatever the real failure was. Pin UTF-8 so a genuine error is readable.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace
        run: npm ci

      # The real cross-compile: three targets, lipo'd into a fat simulator slice
      # and packaged as an xcframework. This is the artifact Swift links against.
      - name: Build the Rust core into an xcframework
        run: npm run build:core:ios

      - name: The xcframework carries the current C header
        run: |
          set -euo pipefail
          header="native/aloud-tts/ios/AloudCore.xcframework/ios-arm64/Headers/aloud_core.h"
          echo "--- $header ---"
          cat "$header"
          # Guard against a stale xcframework being picked up: the packaged
          # header must match the canonical one the Rust exports are checked
          # against in ci.yml.
          diff "$header" core/include/aloud_core.h

      - name: pod install
        working-directory: example/ios
        run: pod install

      - name: Build the app for the simulator
        working-directory: example/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace AloudApp.xcworkspace \
            -scheme AloudApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO

  e2e-ios:
    name: E2E (Maestro golden flow on a booted simulator)
    runs-on: macos-latest
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      # Maestro installs an XCUITest runner onto the simulator before the first
      # command. On a cold CI runner that exceeds its default budget and fails
      # with "iOS driver not ready in time" long before any assertion runs — a
      # setup timeout, not a product signal. Ten minutes is generous on purpose;
      # it costs nothing when the driver comes up quickly.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "600000"
      MAESTRO_CLI_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace
        run: npm ci

      - name: Build the Rust core into an xcframework
        run: npm run build:core:ios

      - name: pod install
        working-directory: example/ios
        run: pod install

      # Debug, not Release: the reader canvas is currently blank in Release
      # builds because reader.js is never bundled (#40). Running E2E against
      # Debug is a real limitation — a Debug-only flow cannot catch that class
      # of bug, which is exactly what E2E is for — so this should switch to
      # Release as soon as #40 lands.
      - name: Build the app for the simulator
        working-directory: example/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace AloudApp.xcworkspace \
            -scheme AloudApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot a simulator
        id: sim
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          for runtime, devices in json.load(sys.stdin)['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable') and 'iPhone' in d['name']:
                      print(d['udid'])
                      raise SystemExit
          ")
          test -n "$udid" || { echo '::error::no available iPhone simulator'; exit 1; }
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl list devices booted

      - name: Start Metro and pre-build the bundle
        run: |
          set -euo pipefail
          (cd example && npx react-native start >"$RUNNER_TEMP/metro.log" 2>&1 &)
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8081/status >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8081/status
          # Force Metro to compile the bundle now. Otherwise the first launch
          # pays for it and Maestro times out waiting for a blank screen.
          curl -fsS -o /dev/null \
            "http://localhost:8081/index.bundle?platform=ios&dev=true&minify=false"
          echo "bundle ready"

      - name: Install the app
        run: |
          set -euo pipefail
          app="example/ios/build/Build/Products/Debug-iphonesimulator/AloudApp.app"
          test -d "$app" || { echo "::error::missing $app"; exit 1; }
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$app"

      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run the golden flow
        run: maestro test e2e/read-aloud.yaml

      - name: Metro log (on failure)
        if: failure()
        run: tail -100 "$RUNNER_TEMP/metro.log" || true

      - name: Upload Maestro debug output (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: ~/.maestro/tests
          if-no-files-found: ignore

  android:
    name: Android (cargo-ndk · gradle build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install the NDK the app pins
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          # Must match ndkVersion in example/android/build.gradle.
          ndk-version: r27b

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace
        run: npm ci

      # One .so per ABI, including armeabi-v7a — the 32-bit ABI where the
      # size_t/Long mismatch fixed in #32 actually bit.
      - name: Cross-compile the Rust core for every Android ABI
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: scripts/build-android-core.sh

      - name: Every ABI produced a library
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64; do
            path="native/aloud-tts/android/src/main/jniLibs/$abi/libaloud_core.so"
            test -f "$path" || { echo "::error::missing $path"; exit 1; }
            echo "ok: $path ($(stat -c%s "$path") bytes)"
          done

      # Builds the app AND, via autolinking, the AloudTts library module — so
      # this is what actually compiles AloudTtsModule.kt, which the JVM contract
      # job deliberately does not.
      - name: Build the app (autolinks and compiles the native module)
        working-directory: example/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
